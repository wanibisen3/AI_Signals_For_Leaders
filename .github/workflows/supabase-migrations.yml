name: Supabase Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase secrets
        id: check_secrets
        run: |
          has_secrets="true"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::Missing required GitHub secret: SUPABASE_ACCESS_TOKEN. Skipping Supabase migrations."
            has_secrets="false"
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::warning::Missing required GitHub secret: SUPABASE_PROJECT_REF. Skipping Supabase migrations."
            has_secrets="false"
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::warning::Missing required GitHub secret: SUPABASE_DB_PASSWORD. Skipping Supabase migrations."
            has_secrets="false"
          fi
          echo "has_secrets=${has_secrets}" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Link Supabase project
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
